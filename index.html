
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09080c">
<title>JOKER PLUS | متجر الجوكر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #09080c;
  --card: #121018;
  --purple: #35105c;
  --purple-light: #a77ad0;
  --red: #a6192e;
  --white: #f7f4fa;
  --muted: #aaa3b3;
  --border: #33233f;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% -15%, #28113d 0, transparent 48%),
    var(--bg);
  color: var(--white);
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 38px 18px 25px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: var(--purple-light);
}

.logo-line {
  width: 55px;
  height: 2px;
  margin: 13px auto;
  background: linear-gradient(90deg, var(--purple), var(--red));
  border-radius: 10px;
}

header p {
  color: var(--muted);
  font-size: 13px;
  margin: 8px 0;
}

main {
  max-width: 1150px;
  margin: auto;
  padding: 10px 20px 50px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 15px 0 20px;
}

.section-heading h2 {
  font-size: 19px;
  margin: 0;
}

.section-heading span {
  color: var(--muted);
  font-size: 11px;
}

.sections {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.section-card {
  min-width: 0;
  background: linear-gradient(155deg, #17121e, #0e0c12);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 12px;
  overflow: hidden;
  box-shadow: 0 12px 30px #0005;
  transition: .25s;
}

.section-card:hover {
  border-color: #68438b;
  transform: translateY(-3px);
}

.phone {
  height: 210px;
  border: 1px solid #554068;
  border-radius: 17px;
  background: linear-gradient(145deg, #1d1229, #0a090e);
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.phone::before {
  content: "";
  position: absolute;
  top: 7px;
  width: 43px;
  height: 5px;
  border-radius: 9px;
  background: #5a4b65;
  z-index: 2;
}

.phone img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.placeholder {
  text-align: center;
  color: #c9b2df;
  font-size: 38px;
}

.placeholder small {
  display: block;
  font-size: 11px;
  color: #a99ab5;
  margin-top: 10px;
  letter-spacing: 2px;
}

.section-card h3 {
  font-size: 15px;
  margin: 15px 3px 7px;
}

.section-description {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
  margin: 0 3px 13px;
}

.services {
  display: grid;
  gap: 10px;
}

.service {
  border-top: 1px solid #2a2230;
  padding: 12px 2px 0;
}

.service-title {
  font-size: 13px;
  font-weight: bold;
}

.service-description {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.7;
  margin: 6px 0;
}

.price {
  color: #d2b2f0;
  font-size: 13px;
  font-weight: bold;
  margin: 8px 0;
}

.buy-button {
  display: block;
  text-decoration: none;
  text-align: center;
  padding: 11px;
  border-radius: 11px;
  background: linear-gradient(100deg, #35105c, #51227b);
  color: white;
  font-size: 12px;
  font-weight: bold;
  transition: .2s;
}

.buy-button:hover {
  background: linear-gradient(100deg, #51227b, #35105c);
}

.empty {
  font-size: 12px;
  color: #81778a;
  padding: 9px 2px;
}

footer {
  text-align: center;
  color: #756c7c;
  font-size: 11px;
  padding: 25px 15px;
  border-top: 1px solid #211a29;
}

.footer-logo {
  font-size: 16px;
  font-weight: bold;
  color: #c5a4df;
  margin-bottom: 8px;
}

@media (max-width: 700px) {
  .sections {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
  }

  .section-card {
    padding: 9px;
  }

  .phone {
    height: 175px;
  }

  .logo {
    font-size: 29px;
  }

  main {
    padding-right: 13px;
    padding-left: 13px;
  }
}

@media (max-width: 390px) {
  .sections {
    grid-template-columns: 1fr;
  }

  .phone {
    height: 230px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">JOKER <span>PLUS</span></div>
  <div class="logo-line"></div>
  <p>وجهتك للخدمات الرقمية المميزة</p>
</header>

<main>

  <div class="section-heading">
    <h2>أقسام المتجر</h2>
    <span>JOKER PLUS COLLECTION</span>
  </div>

  <div class="sections" id="sections">
    <p class="empty">جاري تحميل المتجر...</p>
  </div>

</main>

<footer>
  <div class="footer-logo">JOKER PLUS</div>
  جميع الحقوق محفوظة © 2026
</footer>

<script>
/* إعدادات Supabase */

const SUPABASE_URL =
"https://pvyqzpqqrqzpbzcpftvx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2eXF6cHFxcnF6cGJ6Y3BmdHZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NTY0ODIsImV4cCI6MjExMDMzMjQ4Mn0.FRnb1AuTfOoW3CjJR_XdiGnS9ruHKJuwQt4WCfXUHGY";

/* رقم واتساب المتجر */

const WHATSAPP_NUMBER = "+965 66985873";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

/* الأقسام */

const categories = [
  {
    id: "apps",
    name: "تطبيقات بلس",
    description: "اشتراكات وتطبيقات مميزة",
    icon: "✦"
  },
  {
    id: "games",
    name: "أكواد سناب وألعاب",
    description: "أكواد وخدمات الألعاب",
    icon: "♛"
  },
  {
    id: "social",
    name: "خدمات تيك توك وإنستغرام",
    description: "خدمات منصات التواصل الاجتماعي",
    icon: "◎"
  },
  {
    id: "iptv",
    name: "خدمات IPTV",
    description: "خدمات المشاهدة والترفيه",
    icon: "▣"
  },
  {
    id: "store",
    name: "خدمات أكواد ستور",
    description: "أكواد ومتاجر رقمية",
    icon: "◇"
  },
  {
    id: "soon",
    name: "قريباً",
    description: "خدمات جديدة بالطريق",
    icon: "＋"
  }
];

/* إنشاء رابط الشراء */

function createWhatsAppLink(item) {
  const message =
    `السلام عليكم، أرغب بطلب: ${item.title} - السعر: ${item.price}`;

  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
}

/* تحميل المتجر */

async function loadStore() {

  const root = document.getElementById("sections");

  root.innerHTML =
    "<p class='empty'>جاري تحميل المتجر...</p>";

  const [itemsResult, imagesResult] = await Promise.all([

    db
      .from("store_items")
      .select("*")
      .eq("active", true)
      .order("id"),

    db
      .from("section_images")
      .select("*")

  ]);

  if (itemsResult.error || imagesResult.error) {

    root.innerHTML =
      "<p class='empty'>تعذر تحميل المتجر. تأكد من إعداد Supabase.</p>";

    return;
  }

  const items = itemsResult.data || [];
  const images = imagesResult.data || [];

  root.innerHTML = "";

  categories.forEach(category => {

    const image = images.find(
      item => item.section === category.id
    );

    const services = items.filter(
      item => item.section === category.id
    );

    const card = document.createElement("article");
    card.className = "section-card";

    /* صورة القسم */

    const phone = document.createElement("div");
    phone.className = "phone";

    if (image && image.image_url) {

      const img = document.createElement("img");

      img.src = image.image_url;
      img.alt = category.name;
      img.loading = "lazy";

      img.onerror = () => {
        phone.innerHTML =
          `<div class="placeholder">${category.icon}<small>JOKER PLUS</small></div>`;
      };

      phone.appendChild(img);

    } else {

      phone.innerHTML =
        `<div class="placeholder">${category.icon}<small>JOKER PLUS</small></div>`;

    }

    /* اسم القسم */

    const heading = document.createElement("h3");
    heading.textContent = category.name;

    /* وصف القسم */

    const description = document.createElement("p");
    description.className = "section-description";
    description.textContent = category.description;

    /* قائمة الخدمات */

    const servicesContainer = document.createElement("div");
    servicesContainer.className = "services";

    if (services.length === 0) {

      const empty = document.createElement("div");
      empty.className = "empty";

      empty.textContent =
        category.id === "soon"
          ? "قريباً..."
          : "لا توجد خدمات حالياً";

      servicesContainer.appendChild(empty);

    }

    services.forEach(item => {

      const service = document.createElement("div");
      service.className = "service";

      const title = document.createElement("div");
      title.className = "service-title";
      title.textContent = item.title;

      const detail = document.createElement("div");
      detail.className = "service-description";
      detail.textContent = item.description || "";

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = item.price || "السعر عند الطلب";

      service.appendChild(title);
      service.appendChild(detail);
      service.appendChild(price);

      if (category.id !== "soon") {

        const buy = document.createElement("a");

        buy.className = "buy-button";
        buy.href = createWhatsAppLink(item);
        buy.target = "_blank";
        buy.rel = "noopener";
        buy.textContent = "شراء الآن";

        service.appendChild(buy);

      }

      servicesContainer.appendChild(service);

    });

    card.appendChild(phone);
    card.appendChild(heading);
    card.appendChild(description);
    card.appendChild(servicesContainer);

    root.appendChild(card);

  });

}

/* تشغيل المتجر */

loadStore();

</script>

</body>
</html>
