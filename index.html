
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09080c">
<title>JOKER PLUS | متجر الجوكر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#09080c;--card:#121018;--purple:#35105c;--red:#a6192e;--white:#f7f4fa;--muted:#aaa3b3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#28113d 0,transparent 48%),var(--bg);color:var(--white);font-family:Arial,sans-serif}
header{padding:30px 18px 20px;text-align:center}
.logo{font-size:30px;font-weight:900;letter-spacing:2px}
.logo span{color:#b98be7}
header p{color:var(--muted);font-size:13px;margin:9px 0}
main{max-width:1100px;margin:auto;padding:10px 18px 50px}
h2{font-size:19px;margin:20px 0 15px}
.sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.section{background:linear-gradient(160deg,#17121e,#0e0c12);border:1px solid #33233f;border-radius:19px;padding:12px;min-width:0;box-shadow:0 12px 30px #0005}
.phone{height:190px;border:1px solid #554068;border-radius:17px;background:linear-gradient(145deg,#1d1229,#0a090e);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.phone:before{content:"";position:absolute;top:7px;width:43px;height:5px;border-radius:9px;background:#5a4b65;z-index:2}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{text-align:center;color:#c9b2df;font-size:34px}
.placeholder small{display:block;font-size:11px;color:#a99ab5;margin-top:8px}
.section h3{font-size:15px;margin:13px 3px 6px}
.section p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 3px 12px;min-height:35px}
.services{display:grid;gap:9px}
.service{border-top:1px solid #2a2230;padding:10px 2px 0}
.service strong{font-size:13px}
.service .desc{font-size:11px;color:var(--muted);margin:5px 0}
.price{color:#d2b2f0;font-size:13px;font-weight:bold;margin:6px 0}
.buy{display:block;text-decoration:none;text-align:center;padding:9px;border-radius:10px;background:linear-gradient(100deg,#35105c,#51227b);color:white;font-size:12px;font-weight:bold}
.empty{font-size:12px;color:#81778a;padding:8px 2px}
footer{text-align:center;color:#756c7c;font-size:11px;padding:20px}
@media(max-width:700px){.sections{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.section{padding:9px}.phone{height:165px}.logo{font-size:26px}}
@media(max-width:390px){.sections{grid-template-columns:1fr}.phone{height:210px}}
</style>
</head>
<body>
<header>
  <div class="logo">JOKER <span>PLUS</span></div>
  <p>وجهتك للخدمات الرقمية المميزة</p>
</header>
<main>
  <h2>اكتشف أقسام المتجر</h2>
  <div class="sections" id="sections"></div>
</main>
<footer>JOKER PLUS © جميع الحقوق محفوظة</footer>
<script>
const SUPABASE_URL = "https://pvyqzpqqrqzpbzcpftvx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";
const WHATSAPP_NUMBER = "965XXXXXXXX";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const categories = [
  {id:"apps",name:"تطبيقات بلس",desc:"اشتراكات وتطبيقات مميزة",icon:"✦"},
  {id:"games",name:"أكواد سناب وألعاب",desc:"أكواد وخدمات الألعاب",icon:"♛"},
  {id:"social",name:"خدمات تيك توك وإنستغرام",desc:"خدمات منصات التواصل",icon:"◎"},
  {id:"iptv",name:"خدمات IPTV",desc:"مشاهدة وترفيه",icon:"▣"},
  {id:"store",name:"خدمات أكواد ستور",desc:"أكواد ومتاجر رقمية",icon:"◇"},
  {id:"soon",name:"قريباً",desc:"خدمات جديدة بالطريق",icon:"＋"}
];

function buyLink(item){
  const message = `السلام عليكم، أرغب بطلب: ${item.title} - السعر: ${item.price}`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
}

async function loadStore(){
  const root=document.getElementById("sections");
  root.innerHTML="<p class='empty'>جاري تحميل المتجر...</p>";

  const [{data:items,error:itemError},{data:images,error:imageError}] = await Promise.all([
    db.from("store_items").select("*").eq("active",true).order("id"),
    db.from("section_images").select("*")
  ]);

  if(itemError || imageError){
    root.innerHTML="<p class='empty'>تعذر تحميل المتجر. تأكد من إعداد Supabase.</p>";
    return;
  }

  root.innerHTML="";
  categories.forEach(category=>{
    const image=images.find(x=>x.section===category.id);
    const services=items.filter(x=>x.section===category.id);
    const card=document.createElement("article");
    card.className="section";

    const phone=document.createElement("div");
    phone.className="phone";

    if(image){
      const img=document.createElement("img");
      img.src=image.image_url;
      img.alt=category.name;
      phone.appendChild(img);
    }else{
      phone.innerHTML=`<div class="placeholder">${category.icon}<small>JOKER PLUS</small></div>`;
    }

    const heading=document.createElement("h3");
    heading.textContent=category.name;
    const desc=document.createElement("p");
    desc.textContent=category.desc;

    const serviceList=document.createElement("div");
    serviceList.className="services";

    if(services.length===0){
      const empty=document.createElement("div");
      empty.className="empty";
      empty.textContent=category.id==="soon"?"قريباً...":"لا توجد خدمات حالياً";
      serviceList.appendChild(empty);
    }

    services.forEach(item=>{
      const row=document.createElement("div");
      row.className="service";
      const title=document.createElement("strong");
      title.textContent=item.title;
      const detail=document.createElement("div");
      detail.className="desc";
      detail.textContent=item.description||"";
      const price=document.createElement("div");
      price.className="price";
      price.textContent=item.price||"السعر عند الطلب";
      row.append(title,detail,price);
      if(category.id!=="soon"){
        const link=document.createElement("a");
        link.className="buy";
        link.href=buyLink(item);
        link.target="_blank";
        link.rel="noopener";
        link.textContent="شراء الآن";
        row.appendChild(link);
      }
      serviceList.appendChild(row);
    });

    card.append(phone,heading,desc,serviceList);
    root.appendChild(card);
  });
}
loadStore();
</script>
</body>
</html>
