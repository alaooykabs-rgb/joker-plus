<html lang="ar" dir="rtl">

<style>
:root {
  --bg:#09080c;
  --purple:#35105c;
  --purple-light:#a77ad0;
  --red:#a6192e;
  --white:#f7f4fa;
  --muted:#aaa3b3;
  --border:#33233f;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:
    radial-gradient(ellipse at 50% -15%,#28113d 0,transparent 48%),
    var(--bg);
  color:var(--white);
  font-family:Arial,sans-serif;
}

header {
  text-align:center;
  padding:38px 18px 25px;
}

.logo {
  font-size:34px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span { color:var(--purple-light); }

.logo-line {
  width:55px;
  height:2px;
  margin:13px auto;
  background:linear-gradient(90deg,var(--purple),var(--red));
  border-radius:10px;
}

header p {
  color:var(--muted);
  font-size:13px;
  margin:8px 0;
}

main {
  max-width:1150px;
  margin:auto;
  padding:10px 20px 50px;
}

.section-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:15px 0 20px;
}

.section-heading h2 {
  font-size:19px;
  margin:0;
}

.section-heading span {
  color:var(--muted);
  font-size:11px;
}

.sections {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}

.section-card {
  min-width:0;
  background:linear-gradient(155deg,#17121e,#0e0c12);
  border:1px solid var(--border);
  border-radius:20px;
  padding:14px;
  overflow:hidden;
  box-shadow:0 12px 30px #0005;
  transition:.25s;
}

.section-card:hover {
  border-color:#68438b;
  transform:translateY(-3px);
}

/* الهاتف ثلاثي الأبعاد */

.phone-stage {
  width:100%;
  height:285px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
  background:radial-gradient(ellipse at center,#54247a44,transparent 68%);
  perspective:900px;
}

.phone {
  width:150px;
  height:260px;
  flex:none;
  padding:7px;
  position:relative;
  border-radius:30px;
  background:linear-gradient(
    110deg,
    #17131e 0%,
    #a69aaf 8%,
    #49404f 13%,
    #17131e 23%,
    #777080 50%,
    #211b29 75%,
    #a69aaf 92%,
    #211b29 100%
  );
  box-shadow:
    8px 12px 0 #100b16,
    12px 18px 0 #08060b,
    0 25px 35px #000b,
    0 0 22px #8d56b333,
    inset 0 0 0 1px #e8d9f5aa;
  transform:rotateY(-9deg) rotateX(3deg);
  transition:transform .35s ease,box-shadow .35s ease;
}

.section-card:hover .phone {
  transform:rotateY(-3deg) rotateX(1deg) translateY(-3px);
  box-shadow:
    5px 9px 0 #100b16,
    9px 14px 0 #08060b,
    0 30px 40px #000c,
    0 0 28px #a77ad055,
    inset 0 0 0 1px #e8d9f5aa;
}

.phone::before {
  content:"";
  position:absolute;
  right:-4px;
  top:58px;
  width:4px;
  height:45px;
  border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,#49404f,#b9adbf,#302737);
}

.phone::after {
  content:"";
  position:absolute;
  left:-4px;
  top:67px;
  width:4px;
  height:36px;
  border-radius:4px 0 0 4px;
  background:linear-gradient(90deg,#b9adbf,#49404f);
}

.phone-screen {
  width:100%;
  height:100%;
  border-radius:23px;
  overflow:hidden;
  position:relative;
  background:radial-gradient(ellipse at 50% 20%,#35105c,#100b18 65%,#08070b);
  padding:20px 9px 10px;
  box-shadow:inset 0 0 0 1px #ffffff20;
}

.phone-time {
  position:absolute;
  top:8px;
  right:12px;
  font-size:7px;
  color:#eee;
  z-index:2;
}

.phone-brand {
  text-align:center;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.5px;
  color:#d8c4ed;
  margin:5px 0 13px;
}

.app-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px 5px;
  justify-items:center;
}

.app-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:0;
}

.app-icon {
  width:29px;
  height:29px;
  border-radius:9px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#fff;
  box-shadow:0 3px 8px #0008;
}

.app-icon img {
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.app-name {
  font-size:6px;
  color:#ddd3e7;
  margin-top:4px;
  text-align:center;
  white-space:nowrap;
}

/* قسم سناب */

.snapchat-screen {
  height:100%;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 50% 40%,#29200a,#100e0a 65%,#080807);
}

.snapchat-logo {
  width:105px;
  height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:27px;
  background:#fffc00;
  box-shadow:
    0 0 30px #fffc0044,
    0 10px 25px #0008,
    inset 0 2px 5px #ffffffaa;
}

.snapchat-logo img {
  width:75px;
  height:75px;
  object-fit:contain;
}

.snapchat-caption {
  color:#fffc00;
  font-size:10px;
  font-weight:bold;
  letter-spacing:2px;
  margin-top:17px;
}

.phone-coming {
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.phone-coming strong {
  font-size:12px;
  letter-spacing:2px;
  color:#e3c8ff;
}

.phone-coming span {
  font-size:7px;
  color:#a99ab5;
  margin-top:8px;
}

.custom-phone-image {
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:20px;
}

.phone-footer {
  position:absolute;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  width:48px;
  height:3px;
  border-radius:5px;
  background:#ffffff90;
}

/* بطاقات شحن PlayStation لقسم أكواد ستور */

.store-stage {
  width:100%;
  height:285px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  perspective:900px;
  background:radial-gradient(ellipse at center,#54247a55,transparent 68%);
}

.store-cards {
  width:190px;
  height:225px;
  position:relative;
  transform-style:preserve-3d;
}

.store-card {
  position:absolute;
  width:132px;
  height:190px;
  border-radius:15px;
  border:1px solid #b99ad7;
  background:

    linear-gradient(145deg,#30203e,#100d17 68%);
  box-shadow:0 16px 28px #000a,inset 0 1px 0 #ffffff35;
}

.store-card.back-one {
  left:4px;
  top:18px;
  transform:rotate(-17deg) translateZ(-22px);
  background:linear-gradient(145deg,#4c2670,#17101f 75%);
}

.store-card.back-two {
  right:4px;
  top:12px;
  transform:rotate(15deg) translateZ(-12px);
  background:linear-gradient(145deg,#60338a,#17101f 75%);
}

.store-card.front {
  left:29px;
  top:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:rotateY(-9deg) rotateX(3deg);
  box-shadow:8px 12px 0 #100b16,0 25px 35px #000b,0 0 25px #a77ad044,inset 0 1px 0 #ffffff55;
  transition:transform .35s ease;
}

.section-card:hover .store-card.front {
  transform:rotateY(-3deg) rotateX(1deg) translateY(-4px);
}

.store-card.front img {
  width:75px;
  height:75px;
  object-fit:contain;
  filter:drop-shadow(0 5px 12px #0009);
}

/* تلفزيون قسم IPTV */

.tv-stage {
  width:100%;
  height:285px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  perspective:900px;
  background:radial-gradient(ellipse at center,#54247a55,transparent 68%);
}

.tv-set {
  width:min(245px,92%);
  position:relative;
  padding-bottom:25px;
  filter:drop-shadow(0 22px 18px #0009);
  transform:rotateY(-5deg);
  transition:transform .35s ease;
}

.section-card:hover .tv-set {
  transform:rotateY(0deg) translateY(-3px);
}

.tv-screen {
  width:100%;
  aspect-ratio:16/10;
  border:7px solid #24202b;
  border-bottom-width:10px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 35%,#54247a 0,#21112f 48%,#08070b 100%);
  box-shadow:inset 0 0 0 1px #ffffff45,0 0 0 1px #8e78a0;
}

.tv-screen::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,#ffffff12,transparent 35%,#ffffff08 65%,transparent);
  pointer-events:none;
}

.tv-logo {
  color:#f7f4fa;
  font-size:clamp(19px,5vw,27px);
  font-weight:900;
  letter-spacing:1.4px;
  text-shadow:0 0 18px #b77be8aa;
  direction:ltr;
}

.tv-logo span { color:#c79be9; }

.tv-indicator {
  position:absolute;
  bottom:3px;
  left:50%;
  transform:translateX(-50%);
  width:4px;
  height:4px;
  border-radius:50%;
  background:#bd8de7;
  box-shadow:0 0 7px #bd8de7;
}

.tv-stand {
  width:65px;
  height:17px;
  margin:-1px auto 0;
  background:linear-gradient(90deg,#17131e,#5c5364 50%,#17131e);
  clip-path:polygon(39% 0,61% 0,76% 72%,100% 100%,0 100%,24% 72%);
}

.tv-base {
  width:105px;
  height:7px;
  margin:-1px auto 0;
  border-radius:50%;
  background:linear-gradient(180deg,#71687a,#211b29 75%);
  box-shadow:0 5px 9px #0009;
}

/* معلومات الأقسام */

.section-card h3 {
  font-size:15px;
  margin:15px 3px 7px;
}

.section-description {
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
  margin:0 3px 13px;
}

.services {
  display:grid;
  gap:10px;
}

.service {
  border-top:1px solid #2a2230;
  padding:12px 2px 0;
}

.service-title {
  font-size:13px;
  font-weight:bold;
}

.service-description {
  font-size:11px;
  color:var(--muted);
  line-height:1.7;
  margin:6px 0;
}

.price {
  color:#d2b2f0;
  font-size:13px;
  font-weight:bold;
  margin:8px 0;
}

.buy-button {
  display:block;
  text-decoration:none;
  text-align:center;
  padding:11px;
  border-radius:11px;
  background:linear-gradient(100deg,#35105c,#51227b);
  color:white;
  font-size:12px;
  font-weight:bold;
  transition:.2s;
}

.buy-button:hover {
  background:linear-gradient(100deg,#51227b,#35105c);
}

.empty {
  font-size:12px;
  color:#81778a;
  padding:9px 2px;
}

.loading-message,
.error-message {
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
  font-size:13px;
  line-height:1.8;
}

.error-message { color:#e8a1a8; }

footer {
  text-align:center;
  color:#756c7c;
  font-size:11px;
  padding:25px 15px;
  border-top:1px solid #211a29;
}

.footer-logo {
  font-size:16px;
  font-weight:bold;
  color:#c5a4df;
  margin-bottom:8px;
}

@media(max-width:700px) {
  .sections {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .section-card { padding:9px; }

  .phone-stage { height:285px; }

  .logo { font-size:29px; }

  main {
    padding-right:13px;
    padding-left:13px;
  }
}

@media(max-width:390px) {
  .sections { grid-template-columns:1fr; }
  .phone-stage { height:285px; }
}

@media(prefers-reduced-motion:reduce) {
  .phone,.section-card { transition:none; }
}

/* شاشة البداية المتحركة */

.splash-screen {
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%,#35105c 0%,#170d20 32%,#09080c 72%);
  opacity:1;
  visibility:visible;
  transition:opacity .65s ease,visibility .65s ease;
}

.splash-screen::before {
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border:1px solid #a77ad033;
  border-radius:50%;
  box-shadow:0 0 70px #8b4acb22,inset 0 0 60px #8b4acb18;
  animation:splashAura 2.4s ease-in-out infinite;
}

.splash-screen.is-hidden {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.splash-emblem {
  width:112px;
  height:112px;
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transform:translateY(22px) scale(.65) rotate(-18deg);
  animation:emblemEnter .9s cubic-bezier(.2,.8,.2,1) .15s forwards,
            emblemFloat 2s ease-in-out 1.1s infinite;
  filter:drop-shadow(0 0 22px #a77ad077);
}

.splash-emblem svg {
  width:100%;
  height:100%;
  overflow:visible;
}

.splash-emblem .emblem-main {
  stroke-dasharray:260;
  stroke-dashoffset:260;
  animation:drawEmblem 1.05s ease .35s forwards;
}

.splash-emblem .emblem-dot {
  opacity:0;
  transform-box:fill-box;
  transform-origin:center;
  animation:dotPop .4s ease .95s forwards;
}

.splash-name {
  position:relative;
  z-index:1;
  direction:ltr;
  font-size:clamp(27px,7vw,38px);
  font-weight:900;
  letter-spacing:3px;
  color:#f7f4fa;
  opacity:0;
  transform:translateY(13px);
  animation:nameReveal .75s ease 1.15s forwards;
}

.splash-name span { color:#c49be5; }

.splash-caption {
  position:relative;
  z-index:1;
  color:#aaa3b3;
  font-size:10px;
  letter-spacing:3px;
  opacity:0;
  animation:nameReveal .6s ease 1.55s forwards;
}

.splash-loader {
  position:relative;
  z-index:1;
  width:76px;
  height:2px;
  margin-top:7px;
  overflow:hidden;
  background:#ffffff18;
  border-radius:4px;
  opacity:0;
  animation:nameReveal .4s ease 1.65s forwards;
}

.splash-loader::after {
  content:"";
  display:block;
  width:38%;
  height:100%;
  border-radius:4px;
  background:linear-gradient(90deg,#35105c,#c49be5,#a6192e);
  animation:loaderMove 1.15s ease-in-out 1.8s both;
}

@keyframes emblemEnter {
  to { opacity:1;transform:translateY(0) scale(1) rotate(0); }
}

@keyframes emblemFloat {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-7px); }
}

@keyframes drawEmblem { to { stroke-dashoffset:0; } }
@keyframes dotPop { to { opacity:1;transform:scale(1); } }
@keyframes nameReveal { to { opacity:1;transform:translateY(0); } }

@keyframes splashAura {
  0%,100% { transform:scale(.92);opacity:.55; }
  50% { transform:scale(1.08);opacity:1; }
}

@keyframes loaderMove {
  0% { transform:translateX(0); }
  100% { transform:translateX(210%); }
}

@media(prefers-reduced-motion:reduce) {
  .splash-screen *, .splash-screen::before { animation:none !important; }
  .splash-emblem,.splash-name,.splash-caption,.splash-loader {
    opacity:1;
    transform:none;
  }
}
</style>
</head>

}

function createPhone(section, customImage) {
  /* قسم أكواد ستور: بطاقات شحن وشعار PlayStation فقط */
  if (section.id === "store") {
    return `
      <div class="store-stage">
        <div class="store-cards">
          <div class="store-card back-one"></div>
          <div class="store-card back-two"></div>
          <div class="store-card front">
            <img
              src="https://cdn.simpleicons.org/playstation/ffffff"
              alt="PlayStation"
              onerror="this.style.display='none';this.parentElement.textContent='PS';this.parentElement.style.color='#fff';this.parentElement.style.fontSize='48px';this.parentElement.style.fontWeight='bold';"
            >
          </div>
        </div>
      </div>
    `;
  }

  /* قسم IPTV: تلفزيون وشعار JOKER PLUS داخل الشاشة */
  if (section.id === "iptv") {
    return `
      <div class="tv-stage">
        <div class="tv-set">
          <div class="tv-screen">
            <div class="tv-logo">JOKER <span>PLUS</span></div>
            <div class="tv-indicator"></div>
          </div>
          <div class="tv-stand"></div>
          <div class="tv-base"></div>
        </div>
      </div>
    `;
  }

  if (customImage) {
    return `
      <div class="phone-stage">
        <div class="phone">
          <div class="phone-screen" style="padding:0">
            <img
              class="custom-phone-image"
              src="${escapeHTML(customImage)}"
              alt="صورة ${escapeHTML(section.name)}"
            >
          </div>
        </div>
      </div>
    `;
  }

  if (section.id === "games") {
    return `
      <div class="phone-stage">
        <div class="phone">
          <div class="phone-screen" style="padding:0">
            <div class="phone-time">9:41</div>
            <div class="snapchat-screen">
              <div class="snapchat-logo">
                <img
                  src="https://cdn.simpleicons.org/snapchat/000000"
                  alt="Snapchat"
                  onerror="this.style.display='none';this.parentElement.textContent='👻';this.parentElement.style.fontSize='55px';"
                >
              </div>
              <div class="snapchat-caption">SNAPCHAT</div>
            </div>
            <div class="phone-footer"></div>
          </div>
        </div>
      </div>
    `;
  }

  if (section.id === "soon") {
    return `
      <div class="phone-stage">
        <div class="phone">
          <div class="phone-screen">
            <div class="phone-time">9:41</div>
            <div class="phone-coming">
              <strong>COMING SOON</strong>
              <span>JOKER PLUS</span>
            </div>
            <div class="phone-footer"></div>
          </div>
        </div>
      </div>
    `;
  }

  return `
    <div class="phone-stage">
      <div class="phone">
        <div class="phone-screen">
          <div class="phone-time">9:41</div>
          <div class="phone-brand">JOKER PLUS</div>
          <div class="app-grid">
            ${section.apps.map(createAppIcon).join("")}
          </div>
          <div class="phone-footer"></div>
        </div>
      </div>
    </div>
  `;
}

/* حماية النصوص */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

/* رابط واتساب */

function whatsappLink(item) {
  const title = item.title || "طلب من متجر JOKER PLUS";
  const price = item.price ? " - السعر: " + item.price : "";

  const message = "السلام عليكم، أريد طلب: " + title + price;

  return "https://wa.me/" + WHATSAPP_NUMBER +
    "?text=" + encodeURIComponent(message);
}

/* عرض المنتجات */

function createService(item) {
  return `
    <div class="service">
      <div class="service-title">${escapeHTML(item.title)}</div>

      ${
        item.description
          ? `<div class="service-description">${escapeHTML(item.description)}</div>`
          : ""
      }

      ${
        item.price
          ? `<div class="price">${escapeHTML(item.price)}</div>`
          : ""
      }

      <a
        class="buy-button"
        href="${whatsappLink(item)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        اطلب الآن عبر واتساب
      </a>
    </div>
  `;
}

/* بناء القسم */

function createSection(section, items, images) {
  const sectionImage = images.find(
    image => image.section === section.id
  );

  const sectionItems = items.filter(
    item => item.section_key === section.id
  );

  return `
    <article class="section-card">

      ${createPhone(section, sectionImage?.image_url)}

      <h3>${escapeHTML(section.name)}</h3>

      <p class="section-description">
        ${escapeHTML(section.description)}
      </p>

      <div class="services">
        ${
          sectionItems.length
            ? sectionItems.map(createService).join("")
            : `<div class="empty">لا توجد منتجات متاحة حالياً</div>`
        }
      </div>

    </article>
  `;
}

/* تحميل بيانات المتجر */

async function loadStore() {
  const container = document.getElementById("sections");

  try {
    const [itemsResult, imagesResult] = await Promise.all([
      supabaseClient
        .from("store_items")
        .select("*")
        .eq("active", true)
        .order("sort_order", { ascending:true }),

      supabaseClient
        .from("section_images")
        .select("*")
    ]);

    if (itemsResult.error) {
      throw new Error("خطأ المنتجات: " + itemsResult.error.message);
    }

    if (imagesResult.error) {
      throw new Error("خطأ صور الأقسام: " + imagesResult.error.message);
    }

    const items = itemsResult.data || [];
    const images = imagesResult.data || [];

    container.innerHTML = sectionsData.map(section =>
      createSection(section, items, images)
    ).join("");

  } catch (error) {
    console.error("JOKER PLUS:", error);

    container.innerHTML = `
      <div class="error-message">
        تعذر تحميل المتجر.<br>
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}

/* إخفاء شاشة البداية بعد اكتمال الحركة */

window.addEventListener("load", function() {
  window.setTimeout(function() {
    const splash = document.getElementById("splashScreen");
    if (splash) splash.classList.add("is-hidden");
  }, 3200);
});

loadStore();
</script>
