
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09080c">
<title>JOKER PLUS | متجر الجوكر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#09080c;
  --purple:#35105c;
  --light:#b88be0;
  --red:#a6192e;
  --white:#f7f4fa;
  --muted:#aaa3b3;
  --border:#33233f;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:radial-gradient(ellipse at 50% -15%,#28113d 0,transparent 48%),var(--bg);
  color:var(--white);
  font-family:Arial,sans-serif;
}
header {text-align:center;padding:35px 15px 22px}
.logo {font-size:34px;font-weight:900;letter-spacing:2px}
.logo span {color:var(--light)}
.logo-line {
  width:55px;height:2px;margin:13px auto;
  background:linear-gradient(90deg,var(--purple),var(--red));
  border-radius:10px;
}
header p {color:var(--muted);font-size:13px}
main {max-width:1250px;margin:auto;padding:10px 18px 45px}
.section-heading {
  display:flex;align-items:center;justify-content:space-between;
  margin:15px 0 20px;
}
.section-heading h2 {font-size:19px;margin:0}
.section-heading span {color:var(--muted);font-size:11px}

/* شبكة الأقسام: 3 أعمدة وصفّين */
.sections {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(2,auto);
  gap:16px;
}
.section-card {
  min-width:0;
  background:linear-gradient(155deg,#17121e,#0e0c12);
  border:1px solid var(--border);
  border-radius:19px;
  padding:12px;
  overflow:hidden;
  box-shadow:0 12px 30px #0005;
  transition:.25s;
}
.section-card:hover {
  border-color:#68438b;
  transform:translateY(-3px);
}
.section-card h3 {font-size:15px;margin:13px 3px 7px}
.section-description {
  font-size:11px;color:var(--muted);
  line-height:1.7;margin:0 3px 12px;
}

/* الهاتف */
.phone-stage {
  width:100%;height:260px;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;position:relative;
  background:radial-gradient(ellipse at center,#54247a44,transparent 68%);
  perspective:900px;
}
.phone {
  width:140px;height:235px;flex:none;padding:6px;
  border-radius:28px;position:relative;
  background:linear-gradient(110deg,#17131e,#a69aaf 8%,#49404f 13%,#17131e 23%,#777080 50%,#211b29 75%,#a69aaf 92%,#21131e);
  box-shadow:8px 12px 0 #100b16,12px 18px 0 #08060b,
  0 25px 35px #000b,0 0 22px #8d56b333,
  inset 0 0 0 1px #e8d9f5aa;
  transform:rotateY(-8deg) rotateX(3deg);
  transition:.35s;
}
.section-card:hover .phone {transform:rotateY(-2deg) translateY(-3px)}
.phone::before {
  content:"";position:absolute;right:-4px;top:55px;
  width:4px;height:42px;border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,#49404f,#b9adbf,#302737);
}
.phone-screen {
  width:100%;height:100%;border-radius:22px;
  overflow:hidden;position:relative;
  background:radial-gradient(ellipse at 50% 20%,#35105c,#100b18 65%,#08070b);
  padding:18px 8px 10px;
  box-shadow:inset 0 0 0 1px #ffffff20;
}
.phone-time {
  position:absolute;top:7px;right:11px;
  font-size:7px;color:#eee;z-index:2;
}
.phone-brand {
  text-align:center;font-size:8px;font-weight:900;
  letter-spacing:1.5px;color:#d8c4ed;margin:3px 0 12px;
}
.phone-footer {
  position:absolute;bottom:7px;left:50%;
  transform:translateX(-50%);
  width:43px;height:3px;border-radius:5px;background:#ffffff90;
}

/* شبكة التطبيقات داخل الهاتف */
.app-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px 3px;
  justify-items:center;
  align-items:center;
}
.app-item {
  display:flex;flex-direction:column;
  align-items:center;min-width:0;
}
.app-icon {
  width:27px;height:27px;border-radius:8px;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;background:#fff;
  box-shadow:0 3px 8px #0008;
}
.app-icon img {
  width:100%;height:100%;object-fit:contain;display:block;
}
.app-name {
  font-size:5.5px;color:#ddd3e7;
  margin-top:4px;text-align:center;white-space:nowrap;
}

/* شعارا تيك توك وإنستغرام */
.social-screen {
  height:100%;display:flex;align-items:center;
  justify-content:center;flex-direction:column;
  gap:24px;
  background:radial-gradient(circle at center,#301346,#100b18 70%);
}
.social-logos {
  display:flex;align-items:center;justify-content:center;gap:15px;
}
.social-logo {
  width:58px;height:58px;border-radius:17px;
  background:#fff;display:flex;align-items:center;
  justify-content:center;overflow:hidden;
  box-shadow:0 7px 20px #0008,0 0 18px #a77ad044;
}
.social-logo img {width:39px;height:39px;object-fit:contain}
.social-label {
  color:#d9c4ed;font-size:8px;
  letter-spacing:1.4px;font-weight:bold;
}

/* أكواد ستور */
.store-stage {
  width:100%;height:260px;display:flex;align-items:center;
  justify-content:center;position:relative;overflow:hidden;
  perspective:900px;
  background:radial-gradient(ellipse at center,#54247a55,transparent 68%);
}
.store-cards {width:180px;height:210px;position:relative}
.store-card {
  position:absolute;width:120px;height:175px;
  border-radius:15px;border:1px solid #b99ad7;
  background:radial-gradient(circle at 80% 15%,#7545a0 0,transparent 42%),linear-gradient(145deg,#30203e,#100d17 68%);
  box-shadow:0 16px 28px #000a,inset 0 1px 0 #ffffff35;
}
.store-card.back-one {
  left:4px;top:18px;transform:rotate(-17deg);
  background:linear-gradient(145deg,#4c2670,#17101f 75%);
}
.store-card.back-two {
  right:4px;top:12px;transform:rotate(15deg);
  background:linear-gradient(145deg,#60338a,#17101f 75%);
}
.store-card.front {
  left:29px;top:16px;display:flex;
  align-items:center;justify-content:center;
  transform:rotateY(-9deg) rotateX(3deg);
  box-shadow:8px 12px 0 #100b16,0 25px 35px #000b,
  0 0 25px #a77ad044,inset 0 1px 0 #ffffff55;
}
.store-card.front img {width:70px;height:70px;object-fit:contain}

/* تلفزيون Smart TV حديث */
.tv-stage {
  width:100%;height:260px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;perspective:1000px;
  background:radial-gradient(ellipse at center,#54247a55,transparent 68%);
}
.tv-set {
  width:min(245px,95%);
  position:relative;padding-bottom:20px;
  transform:rotateY(-5deg);
  filter:drop-shadow(0 18px 18px #0009);
  transition:.35s;
}
.section-card:hover .tv-set {transform:rotateY(0) translateY(-3px)}
.tv-frame {
  width:100%;aspect-ratio:16/10;
  padding:4px;border-radius:9px;
  background:linear-gradient(135deg,#6d6576,#17131e 18%,#39313f 55%,#0c0a10);
  box-shadow:inset 0 0 0 1px #ffffff40,0 0 0 1px #8c8195;
}
.tv-screen {
  width:100%;height:100%;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%,#55217b 0,#241035 48%,#08070b 100%);
}
.tv-screen::before {
  content:"";position:absolute;inset:0;
  background:linear-gradient(125deg,#ffffff20,transparent 35%,#ffffff08 65%,transparent);
}
.tv-logo {
  color:#f7f4fa;font-size:clamp(18px,4vw,25px);
  font-weight:900;letter-spacing:1.2px;
  text-shadow:0 0 18px #b77be8aa;direction:ltr;
}
.tv-logo span {color:#c79be9}
.tv-indicator {
  position:absolute;bottom:5px;left:50%;
  transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;
  background:#bd8de7;box-shadow:0 0 7px #bd8de7;
}
.tv-neck {
  width:36px;height:16px;margin:auto;
  background:linear-gradient(90deg,#17131e,#5c5364 50%,#17131e);
}
.tv-base {
  width:95px;height:6px;margin:-1px auto 0;
  border-radius:50%;
  background:linear-gradient(180deg,#71687a,#211b29 75%);
}

/* قريباً */
.phone-coming {
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
}
.phone-coming strong {
  font-size:12px;letter-spacing:2px;color:#e3c8ff;
}
.phone-coming span {font-size:7px;color:#a99ab5;margin-top:8px}

/* المنتجات */
.services {display:grid;gap:10px}
.service {border-top:1px solid #2a2230;padding:11px 2px 0}
.service-title {font-size:12px;font-weight:bold}
.service-description {
  font-size:10px;color:var(--muted);line-height:1.7;margin:6px 0;
}
.price {color:#d2b2f0;font-size:12px;font-weight:bold;margin:8px 0}
.buy-button {
  display:block;text-decoration:none;text-align:center;
  padding:10px;border-radius:10px;
  background:linear-gradient(100deg,#35105c,#51227b);
  color:white;font-size:11px;font-weight:bold;
}
.buy-button:hover {background:linear-gradient(100deg,#51227b,#35105c)}
.empty {font-size:11px;color:#81778a;padding:9px 2px}
.loading-message,.error-message {
  grid-column:1/-1;text-align:center;
  color:var(--muted);padding:30px 10px;
  font-size:13px;line-height:1.8;
}
.error-message {color:#e8a1a8}
footer {
  text-align:center;color:#756c7c;font-size:11px;
  padding:25px 15px;border-top:1px solid #211a29;
}
.footer-logo {font-size:16px;font-weight:bold;color:#c5a4df;margin-bottom:8px}

/* يحافظ على 3 أعمدة حتى في الجوال */
@media(max-width:700px) {
  main {padding-right:9px;padding-left:9px}
  .sections {gap:8px}
  .section-card {padding:7px;border-radius:14px}
  .phone-stage,.store-stage,.tv-stage {height:190px}
  .phone {transform:scale(.78) rotateY(-8deg)}
  .store-cards {transform:scale(.75)}
  .tv-set {width:95%;transform:scale(.85)}
  .section-card h3 {font-size:11px;margin-top:9px}
  .section-description {font-size:9px}
  .app-grid {gap:9px 2px}
  .app-icon {width:22px;height:22px;border-radius:6px}
  .app-name {font-size:5px}
  .social-logo {width:40px;height:40px;border-radius:12px}
  .social-logo img {width:28px;height:28px}
  .social-logos {gap:9px}
  .social-screen {gap:15px}
  .tv-logo {font-size:15px}
  .service-title {font-size:10px}
  .service-description {font-size:9px}
  .price {font-size:10px}
  .buy-button {font-size:9px;padding:9px 3px}
}
@media(prefers-reduced-motion:reduce) {
  .phone,.section-card,.tv-set {transition:none}
}
</style>
</head>

<body>
<header>
  <div class="logo">JOKER <span>PLUS</span></div>
  <div class="logo-line"></div>
  <p>وجهتك للخدمات الرقمية المميزة</p>
</header>

<main>
  <div class="section-heading">
    <h2>أقسام المتجر</h2>
    <span>JOKER PLUS COLLECTION</span>
  </div>
  <div class="sections" id="sections">
    <p class="loading-message">جاري تحميل المتجر...</p>
  </div>
</main>

<footer>
  <div class="footer-logo">JOKER PLUS</div>
  جميع الحقوق محفوظة © 2026
</footer>

<script>
const SUPABASE_URL = "https://pvyqzpqqrqzpbzcpftvx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2eXF6cHFxcnF6cGJ6Y3BmdHZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NTY0ODIsImV4cCI6MjExMDMzMjQ4Mn0.FRnb1AuTfOoW3CjJR_XdiGnS9ruHKJuwQt4WCfXUHGY";

const WHATSAPP_NUMBER = "96566985873";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const sectionsData = [
  {
    id:"apps",
    name:"تطبيقات بلس",
    description:"أفضل التطبيقات والخدمات المميزة",
    apps:[
      ["Instagram","instagram"],
      ["Snapchat","snapchat"],
      ["TikTok","tiktok"],
      ["Spotify","spotify"],
      ["YouTube","youtube"],
      ["WhatsApp","whatsapp"],
      ["Telegram","telegram"],
      ["Netflix","netflix"],
      ["Facebook","facebook"],
      ["Discord","discord"],
      ["Pinterest","pinterest"],
      ["X","x"]
    ]
  },
  {
    id:"games",
    name:"أكواد سناب",
    description:"أكواد وخدمات سناب شات",
    apps:[]
  },
  {
    id:"social",
    name:"خدمات التيك توك والإنستغرام",
    description:"خدمات منصات التواصل الاجتماعي",
    apps:[]
  },
  {
    id:"iptv",
    name:"اشتراكات IPTV",
    description:"اشتراكات المشاهدة والترفيه",
    apps:[]
  },
  {
    id:"store",
    name:"أكواد ستور",
    description:"أكواد وشحن المتاجر الرقمية",
    apps:[]
  },
  {
    id:"soon",
    name:"قريباً",
    description:"خدمات ومنتجات جديدة قريباً",
    apps:[]
  }
];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function iconUrl(slug) {
  return "https://cdn.simpleicons.org/" + slug;
}

function createAppIcon(app) {
  const [name,slug] = app;
  return `
    <div class="app-item">
      <div class="app-icon">
        <img src="${iconUrl(slug)}" alt="${name}" loading="lazy"
          onerror="this.style.display='none';this.parentElement.textContent='${name.slice(0,1)}';">
      </div>
      <span class="app-name">${name}</span>
    </div>
  `;
}

function createPhone(section, customImage) {
  if (section.id === "store") {
    return `
      <div class="store-stage">
        <div class="store-cards">
          <div class="store-card back-one"></div>
          <div class="store-card back-two"></div>
          <div class="store-card front">
            <img src="https://cdn.simpleicons.org/playstation/ffffff"
              alt="PlayStation"
              onerror="this.style.display='none';this.parentElement.textContent='PS';this.parentElement.style.color='#fff';this.parentElement.style.fontSize='48px';this.parentElement.style.fontWeight='bold';">
          </div>
        </div>
      </div>
    `;
  }

  if (section.id === "iptv") {
    return `
      <div class="tv-stage">
        <div class="tv-set">
          <div class="tv-frame">
            <div class="tv-screen">
              <div class="tv-logo">JOKER <span>PLUS</span></div>
              <div class="tv-indicator"></div>
            </div>
          </div>
          <div class="tv-neck"></div>
          <div class="tv-base"></div>
        </div>
      </div>
    `;
  }

  if (customImage) {
    return `
      <div class="phone-stage">
        <div class="phone">
          <div class="phone-screen" style="padding:0">
            <img style="width:100%;height:100%;object-fit:cover"
              src="${escapeHTML(customImage)}" alt="${escapeHTML(section.name)}">
          </div>
        </div>
      </div>
    `;
  }

  if (section.id === "social") {
    return `
      <div class="phone-stage">
        <div class="phone">
          <div class="phone-screen">
            <div class="phone-time">9:41</div>
            <div class="social-screen">
              <div class="social-logos">
                <div class="social-logo">
                  <img src="https://cdn.simpleicons.org/tiktok/000000"
                    alt="TikTok">
                </div>
                <div class="social-logo">
                  <img src="https://cdn.simpleicons.org/instagram/E4405F"
                    alt="Instagram">
                </div>
              </div>
              <div class="social-label">JOKER PLUS SOCIAL</div>
            </div>
            <div class="phone-footer"></div>
          </div>
        </div>
      </div>
    `;
  }

  if (section.id === "games") {
    return `
      <div class="phone-stage">
        <div class="phone">
          <div class="phone-screen" style="padding:0">
            <div class="phone-time">9:41</div>
            <div style="height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 40%,#29200a,#100e0a 65%,#080807)">
              <div style="width:90px;height:90px;border-radius:25px;background:#fffc00;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px #fffc0044">
                <img src="https://cdn.simpleicons.org/snapchat/000000" alt="Snapchat" style="width:65px;height:65px">
              </div>
              <div style="color:#fffc00;font-size:9px;font-weight:bold;letter-spacing:2px;margin-top:15px">SNAPCHAT</div>
            </div>
            <div class="phone-footer"></div>
          </div>
        </div>
      </div>
    `;
  }

  if (section.id === "soon") {
    return `
      <div class="phone-stage">
        <div class="phone">
          <div class="phone-screen">
            <div class="phone-time">9:41</div>
            <div class="phone-coming">
              <strong>COMING SOON</strong>
              <span>JOKER PLUS</span>
            </div>
            <div class="phone-footer"></div>
          </div>
        </div>
      </div>
    `;
  }

  return `
    <div class="phone-stage">
      <div class="phone">
        <div class="phone-screen">
          <div class="phone-time">9:41</div>
          <div class="phone-brand">JOKER PLUS</div>
          <div class="app-grid">
            ${section.apps.map(createAppIcon).join("")}
          </div>
          <div class="phone-footer"></div>
        </div>
      </div>
    </div>
  `;
}

function whatsappLink(item) {
  const title = item.title || "طلب من متجر JOKER PLUS";
  const price = item.price ? " - السعر: " + item.price : "";
  const message = "السلام عليكم، أريد طلب: " + title + price;
  return "https://wa.me/" + WHATSAPP_NUMBER +
    "?text=" + encodeURIComponent(message);
}

function createService(item) {
  return `
    <div class="service">
      <div class="service-title">${escapeHTML(item.title)}</div>
      ${item.description ? `<div class="service-description">${escapeHTML(item.description)}</div>` : ""}
      ${item.price ? `<div class="price">${escapeHTML(item.price)}</div>` : ""}
      <a class="buy-button" href="${whatsappLink(item)}"
        target="_blank" rel="noopener noreferrer">
        اطلب الآن عبر واتساب
      </a>
    </div>
  `;
}

function createSection(section, items, images) {
  const sectionImage = images.find(image => image.section === section.id);
  const sectionItems = items.filter(item => item.section_key === section.id);

  return `
    <article class="section-card">
      ${createPhone(section, sectionImage?.image_url)}
      <h3>${escapeHTML(section.name)}</h3>
      <p class="section-description">${escapeHTML(section.description)}</p>
      <div class="services">
        ${sectionItems.length
          ? sectionItems.map(createService).join("")
          : `<div class="empty">لا توجد منتجات متاحة حالياً</div>`
        }
      </div>
    </article>
  `;
}

async function loadStore() {
  const container = document.getElementById("sections");

  try {
    const [itemsResult, imagesResult] = await Promise.all([
      supabaseClient
        .from("store_items")
        .select("*")
        .eq("active", true)
        .order("sort_order", {ascending:true}),

      supabaseClient
        .from("section_images")
        .select("*")
    ]);

    if (itemsResult.error) {
      throw new Error("خطأ المنتجات: " + itemsResult.error.message);
    }

    if (imagesResult.error) {
      throw new Error("خطأ صور الأقسام: " + imagesResult.error.message);
    }

    const items = itemsResult.data || [];
    const images = imagesResult.data || [];

    container.innerHTML = sectionsData.map(section =>
      createSection(section, items, images)
    ).join("");

  } catch (error) {
    console.error("JOKER PLUS:", error);
    container.innerHTML = `
      <div class="error-message">
        تعذر تحميل المتجر.<br>
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}

loadStore();
</script>
</body>
</html>
